<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430"><rect width="1080" height="430" fill="#0f172a"/><g fill="#e2e8f0" font-family="sans-serif"><text x="40" y="46" font-size="27">PolisKu — Local Incident Lab</text><g fill="#1e293b" stroke="#38bdf8" stroke-width="2"><rect x="40" y="100" width="220" height="80" rx="12"/><rect x="370" y="100" width="280" height="80" rx="12"/><rect x="770" y="100" width="260" height="80" rx="12"/><rect x="370" y="285" width="280" height="80" rx="12"/><rect x="770" y="285" width="260" height="80" rx="12"/></g><g font-size="20" text-anchor="middle"><text x="150" y="147">Autocannon / CLI</text><text x="510" y="135">Express + TypeScript</text><text x="510" y="162">:3000 · pg.Pool</text><text x="900" y="147">PostgreSQL 15</text><text x="510" y="332">Prometheus :9090</text><text x="900" y="332">Grafana :3001</text></g><g stroke="#94a3b8" stroke-width="3"><path d="M260 140H370M650 140H770M510 285V180M770 325H650"/></g><text x="530" y="238" font-size="17">/metrics · HTTP, heap, pool, disk, partner</text><text x="40" y="405" font-size="16">All published ports bind to localhost. Disk faults use an isolated 32 MiB tmpfs; database volume is preserved.</text></g></svg>