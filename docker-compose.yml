services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LOG_LEVEL=info
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=poliskudb
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_POOL_MAX=10
      - PG_IDLE_TIMEOUT=30000
      - PG_CONN_TIMEOUT=5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=poliskudb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/002_seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poliskudb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
