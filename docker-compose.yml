name: polisku

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - LOG_LEVEL=info
      - NODE_ENV=production
      - LAB_MODE=true
      - INCIDENT_DISK_DIR=/incident-disk
      - NODE_OPTIONS=--max-old-space-size=384
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=poliskudb
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_POOL_MAX=10
      - PG_IDLE_TIMEOUT=30000
      - PG_CONN_TIMEOUT=5000
    mem_limit: 512m
    tmpfs:
      - /incident-disk:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging
    restart: unless-stopped


  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=poliskudb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/002_seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poliskudb"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *bounded-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    logging: *bounded-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *bounded-logging
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
